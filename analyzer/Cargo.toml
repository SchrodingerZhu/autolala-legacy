[package]
name = "analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
raffine = { path = "../raffine" }
denning = { path = "../denning", features = ["plotters"] }
barvinok = { git = "https://github.com/Roc-Locality/barvinok-rs", rev = "cc72f5071bb7a1a9ec11e228fcb1686c2f8d3f6c" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "log",
    "max_level_trace",
    "release_max_level_info",
] }
palc = { git = "https://github.com/oxalica/palc" }
melior = { version = "0.27.4" }
mlir-sys = "220.0.2"
anyhow = { version = "1.0.98", features = ["backtrace"] }
symbolica = { version = "2.2", default-features = false, features = [
    "bincode",
    "serde",
    "gmp",
] }
comfy-table = "7.1.4"
ahash = "0.8.12"
gmp-mpfr-sys = { version = "1.6.5", features = ["use-system-libs"] }
serde = { version = "1.0.219", features = ["derive"] }
mimalloc = { version = "0.1.48", features = ["override", "v3"] }
serde_json = "1.0.140"
plotters = "0.3.7"
bincode = "2.0.1"
statrs = "0.18.0"
